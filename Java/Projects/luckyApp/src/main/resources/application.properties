spring.datasource.url=jdbc:oracle:thin:@server:1521:XE
spring.datasource.username=system
spring.datasource.password=oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.dialect.oracle.implicit_statement_caching=true

# Zakázat limit, který Hibernate 6 vygeneruje jako 'FETCH FIRST' pro Oracle
spring.data.web.pageable.default-page-size=10000
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.use-new-id-generator-mappings=true

#spring.datasource.url=${DEV_DB_URL}
#spring.datasource.username=${DEV_USERNAME}
#spring.datasource.password=${DEV_PASSWORD}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.application.name=luckyApp
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true